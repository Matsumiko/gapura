name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pakem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare local config
        run: cp apps/worker/wrangler.toml.example apps/worker/wrangler.toml
      - name: Pakem gates + verify
        run: python3 .pakem/pakem.py check
