name = "gapura-sandbox"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "pay.example.com", custom_domain = true }
]

# Database staging (wrangler d1 create gapura-sandbox).
# Untuk produksi, buat database terpisah dan ganti id ini.
[[d1_databases]]
binding = "DB_SANDBOX"
database_name = "gapura-sandbox"
database_id = "22222222-2222-2222-2222-222222222222"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB_PRODUCTION"
database_name = "gapura-production"
database_id = "33333333-3333-3333-3333-333333333333"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "staging"
PANEL_ORIGIN = "https://admin.example.com,https://your-project.pages.dev"
# URL publik Worker, dipakai sebagai callbackUrl transaksi Duitku.
PUBLIC_BASE_URL = "https://pay.example.com"
DUITKU_BASE_URL = "https://sandbox.duitku.com"

[triggers]
# Pemroses retry webhook dan sinkronisasi transaksi PENDING.
crons = ["* * * * *"]
